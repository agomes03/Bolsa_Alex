name: Pruebas

# En cada cambio del código: comprueba que no hay errores de programa y que todas las páginas se abren.
# Usa datos simulados, así que no depende de que Yahoo Finance responda.
on:
  push:
    paths-ignore: ["informe/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar el código (pyflakes)
        run: python -m pyflakes *.py bolsa tests scripts

      - name: Pruebas (cálculos y pantallas)
        run: python -m pytest -q
